# =============================================================================
# Metabase-Pruebas — Ambiente QA local de Metabase Open Source
# =============================================================================
# Uso previsto: instalación NUEVA en el computador de cada integrante que
# todavía no tenga Metabase (por ejemplo, el de Samuel).
#
# ¡ATENCIÓN — COMPUTADOR DE JUAN!
#   En el equipo de Juan ya existe un contenedor creado con `docker run`
#   llamado `metabase-qa`, que usa el volumen `metabase-qa-data`.
#   NO ejecute `docker compose up` en ese equipo. Si lo hiciera, Docker
#   rechazará la creación con el error "container name ... already in use",
#   lo que es una protección intencional. Consulte docs/CONFIGURACION-QA.md.
#
# Base de datos de aplicación: H2 (archivo dentro del volumen). H2 es
# aceptable únicamente para este ambiente académico local; NO es la opción
# recomendada para producción (Metabase recomienda PostgreSQL o MySQL).
#
# Comandos básicos (ejecutar en la carpeta del repositorio):
#   docker compose config          -> valida este archivo y el .env
#   docker compose up -d           -> crea/inicia el contenedor en segundo plano
#   docker compose ps              -> estado y salud del contenedor
#   docker compose logs -f         -> registros en vivo (Ctrl+C para salir)
#   docker compose stop            -> detiene SIN borrar datos
#   docker compose start           -> vuelve a iniciar
#   docker compose restart         -> reinicia
# NUNCA use `docker compose down -v`: el parámetro -v elimina el volumen y
# con él toda la configuración de Metabase (usuarios, preguntas, dashboards).
# =============================================================================

name: metabase-pruebas

services:
  metabase:
    # Versión fija acordada para el proyecto. No cambiar sin autorización.
    image: metabase/metabase:v0.64.1
    container_name: metabase-qa
    # Reinicia automáticamente si falla o al reiniciar Docker Desktop,
    # salvo que el contenedor se haya detenido manualmente.
    restart: unless-stopped
    ports:
      # Publicado SOLO en 127.0.0.1: no es accesible desde otros equipos de la red.
      - "127.0.0.1:${MB_PUERTO_LOCAL:-3000}:3000"
    environment:
      MB_DB_TYPE: h2
      # Ruta del archivo H2 (sin extensión .mv.db) dentro del volumen persistente.
      MB_DB_FILE: /metabase-data/metabase.db
      # Firma las sesiones guardadas en la base de aplicación (mínimo 16 caracteres).
      # El valor real se define en el archivo local .env (no versionado).
      MB_SESSION_SECRET_KEY: ${MB_SESSION_SECRET_KEY:?Defina MB_SESSION_SECRET_KEY en el archivo .env (copie .env.example y siga sus instrucciones)}
    volumes:
      - metabase-data:/metabase-data
    healthcheck:
      # La imagen oficial incluye curl. /api/health responde {"status":"ok"} cuando está lista.
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      # El primer arranque (migraciones de H2) puede tardar varios minutos.
      start_period: 180s

volumes:
  metabase-data:
    # Nombre fijo, igual al usado en la instalación existente de Juan, para que
    # ambos ambientes sean equivalentes y una futura migración sea posible.
    name: metabase-qa-data
